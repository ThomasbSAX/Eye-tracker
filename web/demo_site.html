<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo shop</title>
<style>
  :root { --ink: #1d1d1f; --muted: #6e6e73; --accent: #1f4fa8; --bg: #fafaf7; --card: #fff; }
  body { margin: 0; font: 17px/1.5 -apple-system, Helvetica, sans-serif; color: var(--ink); background: var(--bg); }
  header { position: sticky; top: 0; display: flex; gap: 24px; align-items: center; padding: 14px 32px; background: #fff; border-bottom: 1px solid #e5e5e5; }
  header nav { display: flex; gap: 18px; margin-left: auto; }
  header a { color: var(--ink); text-decoration: none; }
  .logo { font-weight: 700; font-size: 20px; }
  .hero { padding: 80px 32px; display: grid; grid-template-columns: 1.2fr 1fr; gap: 40px; align-items: center; }
  .hero h1 { font-size: 46px; line-height: 1.1; margin: 0 0 16px; }
  .cta { display: inline-block; padding: 14px 28px; border: 0; border-radius: 10px; background: var(--accent); color: #fff; font-size: 18px; cursor: pointer; }
  .visual { height: 320px; border-radius: 16px; background: linear-gradient(135deg, #f5c84c, #e8735a); }
  .grid { padding: 40px 32px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
  .card { background: var(--card); border-radius: 14px; padding: 20px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .card .img { height: 160px; border-radius: 10px; background: #dde3ee; margin-bottom: 12px; }
  .card button { margin-top: 8px; padding: 8px 14px; border: 1px solid var(--accent); background: #fff; color: var(--accent); border-radius: 8px; cursor: pointer; }
  footer { padding: 60px 32px; color: var(--muted); }
  @media (max-width: 700px) { .hero, .grid { grid-template-columns: 1fr; padding: 32px 16px; } header { padding: 12px 16px; } }
</style>
</head>
<body>
<header data-gaze-aoi="menu">
  <div class="logo" data-gaze-aoi="logo">Atelier</div>
  <nav><a href="#" data-gaze-aoi="products link">Products</a><a href="#" data-gaze-aoi="contact link">Contact</a><a href="#" data-gaze-aoi="cart">Cart</a></nav>
</header>
<section class="hero">
  <div>
    <h1 data-gaze-aoi="title">Hand-stitched notebooks</h1>
    <p data-gaze-aoi="tagline">Thick paper, French binding, delivered in 48 hours.</p>
    <button class="cta" data-gaze-aoi="buy button">Buy now</button>
  </div>
  <div class="visual" data-gaze-aoi="hero image"></div>
</section>
<section class="grid">
  <div class="card" data-gaze-aoi="product 1"><div class="img"></div>A5 notebook<br><button data-gaze-aoi="add 1">Add to cart</button></div>
  <div class="card" data-gaze-aoi="product 2"><div class="img"></div>A6 notebook<br><button data-gaze-aoi="add 2">Add to cart</button></div>
  <div class="card" data-gaze-aoi="product 3"><div class="img"></div>Gift box<br><button data-gaze-aoi="add 3">Add to cart</button></div>
  <div class="card" data-gaze-aoi="product 4"><div class="img"></div>Planner<br><button data-gaze-aoi="add 4">Add to cart</button></div>
  <div class="card" data-gaze-aoi="product 5"><div class="img"></div>Refill<br><button data-gaze-aoi="add 5">Add to cart</button></div>
  <div class="card" data-gaze-aoi="product 6"><div class="img"></div>Case<br><button data-gaze-aoi="add 6">Add to cart</button></div>
</section>
<footer data-gaze-aoi="footer">Atelier, 2026. Demo page for the gaze recorder.</footer>
<script src="gaze-recorder.js" data-upload="/upload"></script>
</body>
</html>
